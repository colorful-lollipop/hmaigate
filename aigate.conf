# AIGate Configuration File
# 本地LLM API代理网关配置

# ==================== 代理配置 ====================
# 代理监听地址
proxy.host=127.0.0.1
# 代理监听端口
proxy.port=8080
# 是否自动启动代理
proxy.auto_start=false

# ==================== 上游代理配置 ====================
# 是否启用上游代理
upstream_proxy.enabled=false
# 上游代理地址
upstream_proxy.host=
# 上游代理端口
upstream_proxy.port=0
# 上游代理认证用户名
upstream_proxy.username=
# 上游代理认证密码
upstream_proxy.password=

# ==================== LLM API配置 ====================
# Anthropic Claude API Key
llm.anthropic.api_key=
# Anthropic API Base URL
llm.anthropic.api_base=https://api.anthropic.com

# OpenAI API Key
llm.openai.api_key=
# OpenAI API Base URL
llm.openai.api_base=https://api.openai.com

# ==================== 安全检测配置 ====================
# 是否启用安全检测
security.enabled=true
# 密码泄露检测
security.password_detection=true
# 恶意工具调用检测
security.tool_use_detection=true
# 提示注入检测
security.prompt_injection_detection=true

# ==================== 插件配置 ====================
# 插件目录
plugin.dir=/data/storage/el2/plugin
# 是否启用插件系统
plugin.enabled=true

# ==================== 日志配置 ====================
# 日志级别: debug, info, warn, error
log.level=info
# 日志文件路径
log.file=
