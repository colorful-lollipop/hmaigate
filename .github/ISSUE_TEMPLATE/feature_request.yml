name: 功能建议
description: 提议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提之前可以先看看 README 的 Roadmap，确认该方向是否已在规划中。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么痛点？当前有什么 workaround？
      placeholder: 例：同时使用 Claude Code 和 Codex 时，只有一个端口、需要手动切换 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的形态是什么？（UI、配置、API 等）
      placeholder: 例：每个 Agent 一个端口 ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      placeholder: 其他思路及其取舍（可选）
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 参考资料、类似项目的做法等（可选）
    validations:
      required: false
